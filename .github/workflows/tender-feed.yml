name: Refresh tender feed
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: Europe/London
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tender-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p public
          cp index.html bmc-vans.jpg public/
          python3 scripts/refresh_tenders.py public/tenders.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deploy
